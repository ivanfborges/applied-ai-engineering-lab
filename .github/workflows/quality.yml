name: Repository quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python 3.11 validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check Python syntax
        run: python scripts/validate_repo.py syntax

      - name: Check internal links
        run: python scripts/validate_repo.py links

      - name: Run tests
        run: python scripts/validate_repo.py tests

      - name: Smoke-test Streamlit apps
        run: python scripts/validate_repo.py apps
